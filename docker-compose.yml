services:
  maybech-api:
    build: .
    container_name: maybech-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "run_api.py", "--host", "0.0.0.0", "--port", "8000"]

  maybech-frontend:
    build: ./frontend
    container_name: maybech-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - maybech-api
